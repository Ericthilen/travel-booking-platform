# Dev-profil för snabbare lokal start
spring.application.name=travel-booking-platform-dev

# Databasinställningar för dev
# Använder in-memory för extremt snabb start, eller behåll fil men optimera
spring.datasource.url=jdbc:h2:mem:traveldb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate optimeringar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Generera statistik endast om det behövs för felsökning, annars false
spring.jpa.properties.hibernate.generate_statistics=false

# Mejlinställningar - Inaktivera som default lokalt
app.mail.enabled=false
app.mail.inbound.enabled=false

# Sätt korta men rimliga timeouter ifall mejl ändå slås på manuellt
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
app.mail.inbound.connection-timeout-ms=2000
app.mail.inbound.timeout-ms=2000

# Thymeleaf cache kan vara avstängt för utveckling, men det påverkar inte starttiden negativt (snarare tvärtom om det vore på)
spring.thymeleaf.cache=false

# Loggningsnivåer för att minska brus
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
