spring.application.name=travel-booking-platform
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${TRAVEL_DB_URL:jdbc:h2:file:./data/travel_booking_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${TRAVEL_DB_USERNAME:sa}
spring.datasource.password=${TRAVEL_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME:}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.inbound.enabled=${MAIL_INBOUND_ENABLED:true}
app.mail.inbound.host=${MAIL_IMAP_HOST:imap.gmail.com}
app.mail.inbound.port=${MAIL_IMAP_PORT:993}
app.mail.inbound.folder=${MAIL_IMAP_FOLDER:INBOX}
app.mail.inbound.poll-delay-ms=${MAIL_IMAP_POLL_DELAY_MS:5000}
app.mail.inbound.initial-delay-ms=${MAIL_IMAP_INITIAL_DELAY_MS:15000}
app.mail.inbound.connection-timeout-ms=${MAIL_IMAP_CONNECTION_TIMEOUT_MS:3000}
app.mail.inbound.timeout-ms=${MAIL_IMAP_TIMEOUT_MS:3000}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.survey.base-url=${APP_SURVEY_BASE_URL:}
