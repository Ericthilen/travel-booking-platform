<!DOCTYPE html>
<html
        lang="sv"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kundtjänstlogin – EriGo Travel</title>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/agent-portal.css">
</head>

<body class="agent-login-body">

<main class="agent-login-page">
    <section class="agent-login-card">
        <a class="agent-login-logo" th:href="@{/}">
            <span>E</span>
            <strong>EriGo Travel</strong>
        </a>

        <div class="agent-login-heading">
            <p>Kundtjänstportal</p>
            <h1>Logga in som agent</h1>
            <span>
                Hantera inkommande chattar, telefonkö och mejl från kunder.
            </span>
        </div>

        <div
                class="agent-login-error"
                th:if="${param.error or param.denied}"
        >
            Fel e-postadress, lösenord eller behörighet.
        </div>

        <form
                class="agent-login-form"
                th:action="@{/login}"
                method="post"
        >
            <input type="hidden" name="agentLogin" value="true">
            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
            >

            <label for="agentEmail">E-post</label>
            <input
                    id="agentEmail"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="agent@erigo.se"
                    required
            >

            <label for="agentPassword">Lösenord</label>
            <input
                    id="agentPassword"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Ditt lösenord"
                    required
            >

            <button type="submit">
                Öppna kundtjänst
            </button>
        </form>

        <a class="agent-login-back" th:href="@{/login}">
            Logga in som kund
        </a>
    </section>
</main>

</body>
</html>
