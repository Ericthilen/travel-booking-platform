<!DOCTYPE html>
<html
        lang="sv"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<body>

<header
        class="site-header"
        th:fragment="siteHeader(activePage)"
>
    <script>
        (() => {
            const storageKey = "erigo:form-scroll-position";
            const submitKey = "erigo:last-form-submit";

            const buildFormState = (form) => {
                const action = new URL(form.action || window.location.href, window.location.href);

                return {
                    path: window.location.pathname,
                    y: window.scrollY,
                    actionPath: action.pathname,
                    submittedAt: Date.now()
                };
            };

            try {
                const stored = sessionStorage.getItem(storageKey);
                const position = stored ? JSON.parse(stored) : null;

                if (position
                        && (position.path === window.location.pathname
                                || position.actionPath === window.location.pathname)) {
                    document.documentElement.classList.add("erigo-scroll-restore-pending");
                    document.documentElement.style.scrollBehavior = "auto";
                    window.__erigoPendingScrollPosition = position;
                }
            } catch (error) {
                sessionStorage.removeItem(storageKey);
            }

            document.addEventListener("submit", (event) => {
                const form = event.target;

                if (!(form instanceof HTMLFormElement)) {
                    return;
                }

                if (form.method.toLowerCase() !== "post" || form.dataset.noScrollRestore === "true") {
                    return;
                }

                sessionStorage.setItem(
                        storageKey,
                        JSON.stringify(buildFormState(form))
                );
                sessionStorage.setItem(submitKey, JSON.stringify(buildFormState(form)));
            }, true);
        })();
    </script>
    <script src="/js/form-scroll-preserve.js"></script>

    <a class="logo" th:href="@{/}">
        <span class="logo-mark">E</span>
        <span>EriGo Travel</span>
    </a>

    <nav class="navigation" aria-label="Huvudmeny">
        <div
                class="nav-dropdown staff-dropdown"
                sec:authorize="hasAnyRole('ADMIN','AGENT')"
        >
            <button
                    class="nav-dropdown-toggle staff-dropdown-toggle"
                    type="button"
                    aria-haspopup="true"
            >
                <span
                        th:text="${staffMenuName}"
                >
                    ERIGOS ERIC
                </span>
            </button>

            <div class="nav-dropdown-menu staff-dropdown-menu">
                <a
                        th:href="@{/kundtjanst}"
                        sec:authorize="hasRole('AGENT')"
                >
                    CS dashboard
                </a>
                <span
                        class="nav-disabled-link"
                        sec:authorize="hasRole('ADMIN') and !hasRole('AGENT')"
                >
                    CS dashboard
                </span>

                <a
                        th:href="@{/admin}"
                        sec:authorize="hasRole('ADMIN')"
                >
                    Adminpanel
                </a>
                <span
                        class="nav-disabled-link"
                        sec:authorize="hasRole('AGENT') and !hasRole('ADMIN')"
                >
                    Adminpanel
                </span>

                <a
                        th:href="@{/admin/resor}"
                        sec:authorize="hasRole('ADMIN')"
                >
                    Hantera resor
                </a>
                <span
                        class="nav-disabled-link"
                        sec:authorize="hasRole('AGENT') and !hasRole('ADMIN')"
                >
                    Hantera resor
                </span>
            </div>
        </div>

        <a
                th:href="@{/resor}"
                th:classappend="${activePage == 'travels'} ? 'active-link'"
        >
            Flygresor
        </a>

        <a
                th:href="@{/bussresor}"
                th:classappend="${activePage == 'bus'} ? 'active-link'"
        >
            Bussresor
        </a>

        <div
                class="nav-dropdown"
                th:classappend="${activePage == 'lookup' or activePage == 'legal'} ? ' active-dropdown'"
        >
            <button
                    class="nav-dropdown-toggle"
                    type="button"
                    aria-haspopup="true"
            >
                Inför resan
            </button>

            <div class="nav-dropdown-menu">
                <a
                        th:href="@{/hitta-bokning}"
                        th:classappend="${activePage == 'lookup'} ? 'active-link'"
                >
                    Din resa
                </a>

                <a
                        th:href="@{/resevillkor}"
                        th:classappend="${activePage == 'legal'} ? 'active-link'"
                >
                    Resevillkor
                </a>
            </div>
        </div>

        <a
                th:href="@{/mitt-konto}"
                th:classappend="${activePage == 'account'} ? 'active-link'"
                sec:authorize="isAuthenticated()"
        >
            Mitt konto
        </a>

        <a
                class="login-link"
                th:href="@{/login}"
                sec:authorize="isAnonymous()"
        >
            Logga in
        </a>

        <form
                class="logout-form"
                th:action="@{/logout}"
                method="post"
                sec:authorize="isAuthenticated()"
        >
            <button class="logout-button" type="submit">
                Logga ut
            </button>
        </form>
    </nav>

    <button
            class="menu-button"
            type="button"
            aria-label="Öppna meny"
            aria-expanded="false"
    >
        ☰
    </button>

    <div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
</header>

</body>
</html>
